<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldMine | Engagement Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --accent: #CCFF00; /* Cyber Lime */
            --text-main: #E0E0E0;
            --text-dim: #808080;
            --border: #262626;
            --red: #FF3B30;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .status {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
        }

        .podcast-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 4px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .podcast-card:hover {
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .cover-art {
            width: 100px;
            height: 100px;
            background: var(--border);
            border-radius: 2px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            font-weight: 700;
        }

        .info h2 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-dim);
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 2px 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .tag.accent {
            border-color: var(--accent);
            color: var(--accent);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .play-btn {
            background: var(--accent);
            border: none;
            color: var(--bg);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .progress-container {
            flex-grow: 1;
            height: 4px;
            background: var(--border);
            position: relative;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            min-width: 40px;
        }

        .engagement-layer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .takeaway {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 2px solid var(--accent);
        }

        .quotes-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .quote-item {
            font-size: 13px;
            font-style: italic;
            color: var(--text-dim);
            margin-bottom: 10px;
            padding-left: 15px;
            position: relative;
        }

        .quote-item::before {
            content: "“";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 20px;
            top: -5px;
        }

        #loading {
            text-align: center;
            padding: 50px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .error {
            color: var(--red);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 20px;
            border: 1px solid var(--red);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">GOLDMINE // ENGAGEMENT</div>
            <div class="status">LIVE DATA STREAM</div>
        </div>

        <div id="loading">CONNECTING TO MCP STREAM...</div>
        <div id="content" style="display: none;"></div>
    </div>

    <audio id="global-audio" style="display: none;"></audio>

    <script type="module">
        const audio = document.getElementById('global-audio');
        const content = document.getElementById('content');
        const loading = document.getElementById('loading');
        
        let currentBtn = null;
        let currentBar = null;
        let currentTimeDisplay = null;

        function updateProgress() {
            if (audio.duration && currentBar) {
                const percent = (audio.currentTime / audio.duration) * 100;
                currentBar.style.width = percent + '%';
                
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60);
                currentTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => {
            if (currentBtn) currentBtn.innerHTML = '▶';
        });

        function renderPodcasts(results) {
            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '';

            const episodes = Array.isArray(results) ? results : [results];

            episodes.forEach((ep, index) => {
                const card = document.createElement('div');
                card.className = 'podcast-card';
                
                let tagsHtml = '';
                if (ep.vibe && ep.vibe.tone) {
                    ep.vibe.tone.forEach(t => {
                        tagsHtml += `<span class="tag">${t}</span>`;
                    });
                }
                if (ep.publishedAt) {
                    tagsHtml += `<span class="tag accent">${ep.publishedAt}</span>`;
                }

                let engagementHtml = '';
                if (ep.engagement) {
                    engagementHtml = `
                        <div class="engagement-layer">
                            <div class="section-title">Narrative Intelligence</div>
                            <div class="takeaway">${ep.engagement.takeaway || ep.hook || ''}</div>
                            ${ep.engagement.bestQuotes ? `
                                <div class="section-title">Key Quotes</div>
                                <ul class="quotes-list">
                                    ${ep.engagement.bestQuotes.slice(0, 2).map(q => `<li class="quote-item">${q}</li>`).join('')}
                                </ul>
                            ` : ''}
                        </div>
                    `;
                } else {
                    engagementHtml = `
                        <div class="engagement-layer">
                            <div class="section-title">Hook</div>
                            <div class="takeaway">${ep.hook || ep.description || 'No deep intelligence available for this episode.'}</div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="cover-art">
                            <img src="${ep.imageUrl || 'https://via.placeholder.com/100?text=GOLDMINE'}" alt="Cover">
                        </div>
                        <div class="info">
                            <h1>${ep.episode_title || ep.title}</h1>
                            <h2>${ep.podcast_title || 'Podcast'}</h2>
                            <div class="tags">${tagsHtml}</div>
                        </div>
                    </div>
                    <div class="player-controls">
                        <button class="play-btn" data-url="${ep.audio_url}" id="btn-${index}">▶</button>
                        <div class="time" id="time-${index}">0:00</div>
                        <div class="progress-container" id="prog-cont-${index}">
                            <div class="progress-bar" id="bar-${index}"></div>
                        </div>
                    </div>
                    ${engagementHtml}
                `;

                content.appendChild(card);

                const btn = card.querySelector('.play-btn');
                const bar = card.querySelector('.progress-bar');
                const timeDisp = card.querySelector('.time');
                const progCont = card.querySelector('.progress-container');

                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    
                    if (audio.src === url && !audio.paused) {
                        audio.pause();
                        btn.innerHTML = '▶';
                    } else {
                        if (currentBtn && currentBtn !== btn) {
                            currentBtn.innerHTML = '▶';
                        }
                        
                        audio.src = url;
                        audio.play();
                        btn.innerHTML = '⏸';
                        
                        currentBtn = btn;
                        currentBar = bar;
                        currentTimeDisplay = timeDisp;
                    }
                });

                progCont.addEventListener('click', (e) => {
                    if (currentBtn === btn) {
                        const rect = progCont.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const percent = x / rect.width;
                        audio.currentTime = percent * audio.duration;
                    }
                });
            });
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'toolResult') {
                try {
                    const result = event.data.result;
                    const parsed = typeof result === 'string' ? JSON.parse(result) : result;
                    renderPodcasts(parsed);
                } catch (e) {
                    content.innerHTML = `<div class="error">DATA ERROR: ${e.message}</div>`;
                    loading.style.display = 'none';
                }
            }
        });
        
        // Immediate check if result is already present in some environments
        if (window.mcpToolResult) {
            renderPodcasts(window.mcpToolResult);
        }
    </script>
</body>
</html>
