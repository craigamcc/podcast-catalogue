[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-catalogue"
version = "1.0.0"
description = "A robust toolkit for generating structured podcast catalogues from ABC Listen, with AI enrichment, transcription, and speaker diarization."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Craig McCosker"}
]

dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "pydantic>=2.0",
    "certifi",
    "python-dotenv",
]

[project.optional-dependencies]
transcribe = ["mlx-whisper", "pyannote.audio>=3.1", "torchaudio", "yt-dlp"]
index = ["lancedb", "voyager", "numpy"]
ai = ["google-genai"]
http = ["fastapi", "uvicorn"]
# Pinned <2: server.py targets the 1.x FastMCP API (mcp.server.fastmcp),
# which was removed in mcp 2.0. Unpinned installs silently broke CI.
mcp = ["mcp>=1.9,<2.0"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
podcast-catalogue = "podcast_catalogue.cli:main"

[tool.setuptools.packages.find]
include = ["podcast_catalogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
